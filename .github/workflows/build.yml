name: Build

# Baut JamPilot eigenstaendig, einmal pro Plattform.
#
# Warum eine Matrix und nicht ein Job? PyInstaller kann NICHT cross-kompilieren -
# es buendelt die nativen Bibliotheken der Maschine, auf der es laeuft
# (libportaudio, libsndfile, libllvmlite, die BLAS von numpy/scipy). Jede
# Zielplattform braucht darum ihren eigenen Runner.
#
# Intel-macOS wird NICHT mehr gebaut: macos-13 war der letzte kostenlose
# Intel-Runner, wird von GitHub ausgemustert, und der v0.1.0-Job stand ueber
# zwei Stunden in der Warteschlange, ohne je zu starten. Intel-Macs
# installieren aus dem Quelltext (./run.sh) - der letzte wurde 2020 verkauft.
#
# Windows IST seit 1.2.0 dabei, aber anders: Linux und macOS liefern EINE Datei,
# Windows einen Ordner im ZIP. Das ist keine Unstimmigkeit, sondern die
# Antwort auf die SmartScreen-Frage, die den Windows-Bau bis dahin aufgehalten
# hat - eine unsignierte, sich selbst auspackende Exe dieser Groesse IST
# technisch ein Packer. Begruendung im Kopf von packaging/jampilot.spec.
# Deshalb hat Windows hier eigene Schritte: dasselbe Skript wie lokal, nur in
# PowerShell.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # zum Ausprobieren von Hand startbar

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Aeltestes Ubuntu, das GitHub anbietet: Die glibc, gegen die gebaut
          # wird, ist die MINDESTVERSION auf dem Zielrechner. Auf einem neueren
          # Ubuntu zu bauen macht die Binary auf aelteren unbrauchbar.
          - os: ubuntu-22.04
            name: jampilot-linux-x86_64
            artefakte: dist/jampilot
          - os: macos-14
            name: jampilot-macos-arm64       # Apple Silicon
            # Unter macOS zusaetzlich das .app-Buendel: Nur das laesst sich im
            # Finder doppelklicken UND bekommt die Mikrofonfreigabe.
            artefakte: |
              dist/jampilot
              dist/JamPilot.app
          # Hier haengt das ZIP und nicht der Ordner: Der Ordner hat ~1700
          # Dateien, und upload-artifact wuerde sie einzeln uebertragen und beim
          # Herunterladen ein zweites Mal packen. Das ZIP ist ausserdem genau
          # die Datei, die veroeffentlicht wird - was hier haengt, ist dasselbe,
          # was ein Nutzer bekommt.
          - os: windows-latest
            name: jampilot-windows-x86_64
            artefakte: dist/JamPilot-*.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unter Linux liegt PortAudio NICHT im sounddevice-Wheel - es kommt vom
      # System, und PyInstaller kann nur einsammeln, was da ist. Ohne dieses
      # Paket baut es durch und die fertige Binary findet spaeter kein einziges
      # Audiogeraet. Unter macOS bringt das Wheel die dylib selbst mit.
      - name: PortAudio (nur Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev

      # Die Sperrdatei, nicht requirements.txt: Letzteres sagt "librosa>=0.10",
      # und was daraus wird, entscheidet der Kalender. Reproduzierbar ist ein
      # Bau nur gegen exakte Versionen.
      - name: Abhaengigkeiten (exakt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Baut, prueft den Selbsttest AUS DEM BUNDLE und baut dann ein zweites Mal,
      # um die Bitgleichheit nachzuweisen. Genau das Skript, das auch lokal
      # laeuft - die CI soll nichts anderes bauen als du.
      - name: Bauen (+ Reproduzierbarkeit pruefen)
        if: runner.os != 'Windows'
        run: PY=python packaging/build.sh --check

      # Dasselbe unter Windows, mit dem PowerShell-Pendant. `shell: powershell`
      # ist Windows PowerShell 5.1 - dieselbe Fassung, die auf einem frisch
      # aufgesetzten Rechner steht und fuer die build.ps1 geschrieben ist.
      - name: Bauen (Windows, + Reproduzierbarkeit pruefen)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PY = "python"
          .\packaging\build.ps1 --check

      - name: Geraete auflisten (laedt PortAudio wirklich?)
        if: runner.os != 'Windows'
        run: ./dist/jampilot devices || true   # CI-Runner haben keine Soundkarte

      - name: Geraete auflisten (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Ein Runner hat keine Soundkarte - das darf den Bau nicht abbrechen.
          # Interessant ist trotzdem, ob die Zeile ueberhaupt bis zu PortAudio
          # kommt: Das laedt die DLL aus dem Bundle.
          #
          # 'Continue' muss sein: GitHub startet diesen Schritt mit 'Stop', und
          # Windows PowerShell 5.1 macht aus JEDER stderr-Zeile eines nativen
          # Programms einen ErrorRecord. Der Schritt braeche dann an einer
          # PortAudio-Warnung ab, statt an einem Fehler.
          $ErrorActionPreference = 'Continue'
          .\dist\JamPilot\jampilot.exe devices
          exit 0

      # Was die CI ueber die Oberflaeche sagen KANN - und was nicht.
      # Der Selbsttest oben baut das Kontrollfenster gegen die
      # Offscreen-Plattform. Damit ist bewiesen, dass Qt im Bundle geladen und
      # das Fenster konstruiert werden kann - genau der Fehler, der beim
      # Buendeln wirklich passiert (Plattform-Plugin fehlt: "cocoa" bzw. "xcb").
      # NICHT bewiesen ist, dass es auf einem echten Desktop erscheint: Ein
      # Runner hat keine angemeldete Sitzung, keine Soundkarte und kein
      # BlackHole. Das zeigt erst ein echter Start.
      - name: Info.plist des .app pruefen (nur macOS)
        if: runner.os == 'macOS'
        run: |
          plutil -p dist/JamPilot.app/Contents/Info.plist \
            | grep -q NSMicrophoneUsageDescription \
            || { echo "NSMicrophoneUsageDescription fehlt - die App bekaeme keinen Ton"; exit 1; }
          echo "Info.plist ok"

      - name: Pruefsumme
        if: runner.os != 'Windows'
        run: sha256sum dist/jampilot || shasum -a 256 dist/jampilot

      # Die Pruefsumme des ZIP, nicht die einer Datei darin: Veroeffentlicht
      # wird das ZIP, und der Nutzer kann nur nachrechnen, was er
      # heruntergeladen hat.
      - name: Pruefsumme (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-FileHash -Algorithm SHA256 dist\JamPilot-*.zip | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artefakte }}

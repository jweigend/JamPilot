<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
  <title id="title">JamPilot Filterpfad für X, N, ? und -</title>
  <desc id="desc">Visualisierung, wie BTC-Labels X und N in der Live-Pipeline behandelt werden und was im Browser oder Kontrollfenster sichtbar bleibt.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .h1 { font: 700 28px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #111827; }
      .h2 { font: 700 20px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #1f2937; }
      .body { font: 15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #334155; }
      .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .small { font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #64748b; }
      .blue { fill: #e0ecff; stroke: #3b82f6; stroke-width: 2; }
      .amber { fill: #fff3d6; stroke: #f59e0b; stroke-width: 2; }
      .red { fill: #ffe3e3; stroke: #ef4444; stroke-width: 2; }
      .green { fill: #e6f8ea; stroke: #22c55e; stroke-width: 2; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="960"/>
  <text class="h1" x="50" y="58">Filterpfad: aus BTC-X wird nicht „?“ auf dem Screen, sondern meistens „nichts Neues“</text>

  <rect class="box blue" x="60" y="110" width="280" height="170"/>
  <text class="h2" x="82" y="144">BTC-Labels</text>
  <text class="mono" x="82" y="180">X  = unbekannter Akkordtyp</text>
  <text class="mono" x="82" y="208">N  = kein Akkord</text>
  <text class="body" x="82" y="258">Beides kommt frameweise an.</text>

  <rect class="box amber" x="410" y="110" width="280" height="170"/>
  <text class="h2" x="432" y="144">Live-Mapping</text>
  <text class="mono" x="432" y="180">stiller Frame  → -</text>
  <text class="mono" x="432" y="208">hörbarer N     → ?</text>
  <text class="mono" x="432" y="236">X              → ?</text>
  <text class="body" x="432" y="262">Das ist noch nur intern.</text>

  <rect class="box red" x="760" y="110" width="280" height="170"/>
  <text class="h2" x="782" y="144">Segment-Ausgabe</text>
  <text class="mono" x="782" y="180">?  wird verworfen</text>
  <text class="mono" x="782" y="208">-  bleibt sichtbar</text>
  <text class="body" x="782" y="258">Darum erzeugt X keinen Chip.</text>

  <rect class="box green" x="1110" y="110" width="250" height="170"/>
  <text class="h2" x="1132" y="144">UI-Folge</text>
  <text class="mono" x="1132" y="180">kein Event → No music</text>
  <text class="mono" x="1132" y="208">- Event    → No music</text>
  <text class="body" x="1132" y="258">Nie ein Fragezeichen.</text>

  <path class="line" d="M340 185 H410"/>
  <path class="line" d="M690 185 H760"/>
  <path class="line" d="M1040 185 H1110"/>

  <text class="h2" x="60" y="340">Vier Fälle nebeneinander</text>

  <line class="grid" x1="50" y1="360" x2="1350" y2="360"/>
  <line class="grid" x1="50" y1="500" x2="1350" y2="500"/>
  <line class="grid" x1="50" y1="640" x2="1350" y2="640"/>
  <line class="grid" x1="50" y1="780" x2="1350" y2="780"/>
  <line class="grid" x1="50" y1="920" x2="1350" y2="920"/>
  <line class="grid" x1="350" y1="330" x2="350" y2="920"/>
  <line class="grid" x1="680" y1="330" x2="680" y2="920"/>
  <line class="grid" x1="1010" y1="330" x2="1010" y2="920"/>

  <text class="small" x="70" y="390">Fall</text>
  <text class="small" x="370" y="390">Frames / Mapping</text>
  <text class="small" x="700" y="390">Was bleibt nach dem Filter?</text>
  <text class="small" x="1030" y="390">Was sieht der Nutzer?</text>

  <text class="h2" x="70" y="450">1. Nur X</text>
  <text class="mono" x="370" y="450">X X X X  →  ? ? ? ?</text>
  <text class="mono" x="700" y="450">nichts</text>
  <text class="body" x="1030" y="450">Letzter Akkord bleibt; ohne Event: No music</text>

  <text class="h2" x="70" y="590">2. C X C</text>
  <text class="mono" x="370" y="590">C C X X C C  →  C C ? ? C C</text>
  <text class="mono" x="700" y="590">C</text>
  <text class="body" x="1030" y="590">Durchgehend C, kein Flackern</text>

  <text class="h2" x="70" y="730">3. Stille trotz C</text>
  <text class="mono" x="370" y="730">C C C  +  RMS≈0  →  - - -</text>
  <text class="mono" x="700" y="730">-</text>
  <text class="body" x="1030" y="730">„No music“ ist korrekt sichtbar</text>

  <text class="h2" x="70" y="870">4. N im hörbaren Signal</text>
  <text class="mono" x="370" y="870">N N N N  →  ? ? ? ?</text>
  <text class="mono" x="700" y="870">nichts</text>
  <text class="body" x="1030" y="870">Letzter Akkord bleibt, bis ein neuer kommt</text>
</svg>

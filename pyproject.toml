[project]
name = "jampilot"
version = "1.1.0"
description = "Verzoegertes Systemaudio-Loopback mit Akkordanzeige (Vorlauf) fuer Musiker"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6", "librosa>=0.10", "qrcode>=7.4",
                "PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jampilot = "jampilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jampilot"]

# [POC-BTC] Gewichte des BTC-Erkenners gehoeren mit ins Paket -
# ebenso die Web-Anzeige (data/index.html), die web.py beim Import laedt.
[tool.setuptools.package-data]
jampilot = ["data/*.npz", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]   # librosa warnt bei kurzen Fenstern

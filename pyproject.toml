[project]
name = "chordelay"
version = "0.1.0"
description = "Verzoegertes Systemaudio-Loopback mit Akkordanzeige (Vorlauf) fuer Musiker"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6", "librosa>=0.10", "qrcode>=7.4"]

[project.scripts]
chordelay = "chordelay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chordelay"]
